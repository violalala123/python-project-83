{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto mt-12 bg-white p-8 rounded-xl shadow-sm border border-slate-200">
  <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight mb-4">Бесплатно проверяйте сайты на SEO пригодность</h1>
  <p class="text-slate-600 mb-8">Введите адрес веб-страницы для анализа заголовков, описания и доступности.</p>

  <form action="/urls" method="post" class="flex flex-col sm:flex-row gap-3">
    <input 
      type="text" 
      name="url" 
      placeholder="https://www.example.com" 
      value="{{ url|default('') }}"
      class="flex-1 rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
      required
    >
    <button 
      type="submit" 
      class="inline-flex justify-center items-center px-6 py-2.5 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
    >
      Проверить
    </button>
  </form>
</div>
{% endblock %}
